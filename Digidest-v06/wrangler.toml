name = "digit-destiny-api"
main = "worker.js"
compatibility_date = "2026-06-16"

kv_namespaces = [
  { binding = "DIGIT_DESTINY_KV", id = "931f3410247f41d4af10dd9f5c579caf" }
]

[vars]
DIGDEST_OPENROUTER_MODEL = "deepseek/deepseek-chat"

[triggers]
crons = ["0 1 * * *", "0 0 * * *"]

# Secrets (set via `wrangler secret put <NAME>`, not stored here):
#   DIGDEST_OPENROUTER_API_KEY, DIGDEST_TELEGRAM_BOT_TOKEN,
#   DIGDEST_TELEGRAM_WEBHOOK_SECRET, DIGDEST_ADMIN_SECRET,
#   DIGDEST_STRIPE_SECRET_KEY, DIGDEST_STRIPE_WEBHOOK_SECRET,
#   DIGDEST_PAYPAL_CLIENT_ID, DIGDEST_PAYPAL_CLIENT_SECRET
